<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Agix 登录</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100dvh;
    padding-top: 12vh;
  }
  .container { width: 100%; max-width: 360px; padding: 0 20px; }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo .icon { font-size: 48px; line-height: 1; }
  .logo h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-top: 8px; }
  .logo p  { font-size: 13px; color: #888; margin-top: 4px; }
  .form { background: #fff; border-radius: 8px; padding: 24px 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  .field input {
    width: 100%; height: 44px; border: 1px solid #ddd; border-radius: 6px;
    padding: 0 12px; font-size: 15px; outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: #4f46e5; }
  .code-row { display: flex; gap: 10px; }
  .code-row input { flex: 1; }
  .send-code {
    flex-shrink: 0; height: 44px; padding: 0 14px; border: 1px solid #4f46e5;
    border-radius: 6px; background: #fff; color: #4f46e5; font-size: 13px;
    cursor: pointer; white-space: nowrap;
  }
  .send-code:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }
  .btn-login {
    width: 100%; height: 46px; background: #4f46e5; color: #fff; border: none;
    border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer;
    margin-top: 8px;
  }
  .btn-login:disabled { background: #a5b4fc; cursor: not-allowed; }
  .error-msg { color: #e53e3e; font-size: 13px; margin-top: 8px; display: none; }
  .error-msg.show { display: block; }
  .debug-info {
    margin-top: 16px; padding: 10px; background: #f0f0f0; border-radius: 4px;
    font-size: 11px; color: #666; font-family: monospace; word-break: break-all;
  }
  .success-overlay {
    display: none; position: fixed; inset: 0; background: rgba(255,255,255,.95);
    z-index: 100; justify-content: center; align-items: center; flex-direction: column;
  }
  .success-overlay.show { display: flex; }
  .success-overlay .check { font-size: 56px; margin-bottom: 12px; }
  .success-overlay p { font-size: 15px; color: #333; }
  @media (min-width: 768px) {
    body { align-items: center; padding-top: 0; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <div class="icon">🤖</div>
    <h1>Agix</h1>
    <p>AI 开发助手 · 手机验证码登录</p>
  </div>

  <div class="form" id="loginForm">
    <div class="field">
      <label>手机号</label>
      <input type="tel" id="phone" placeholder="请输入手机号" maxlength="11" autocomplete="tel">
    </div>
    <div class="field">
      <label>验证码</label>
      <div class="code-row">
        <input type="text" id="code" placeholder="4位验证码" maxlength="4" inputmode="numeric" autocomplete="one-time-code">
        <button class="send-code" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
      </div>
    </div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="debug-info" id="debugInfo">session: {{ session_id }}</div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="check">&#10003;</div>
  <p>登录成功，请返回桌面应用</p>
</div>

<script>
const SESSION_ID = "{{ session_id }}";
const debugEl = document.getElementById("debugInfo");

function log(msg) {
  console.log(msg);
  debugEl.textContent += "\n" + msg;
}

log("JS loaded, session=" + SESSION_ID);

document.getElementById("phone").addEventListener("input", function(e) {
  this.value = this.value.replace(/[^0-9]/g, "");
});
document.getElementById("code").addEventListener("input", function(e) {
  this.value = this.value.replace(/[^0-9]/g, "");
});

function sendCode() {
  const phone = document.getElementById("phone").value.trim();
  log("sendCode: phone=" + phone);
  if (!/^1[3-9][0-9]{9}$/.test(phone)) {
    log("sendCode: invalid phone");
    return;
  }
  var btn = document.getElementById("sendCodeBtn");
  btn.disabled = true;
  var sec = 60;
  btn.textContent = sec + "s";
  var timer = setInterval(function() {
    sec--;
    if (sec <= 0) {
      clearInterval(timer);
      btn.textContent = "重新发送";
      btn.disabled = false;
    } else {
      btn.textContent = sec + "s";
    }
  }, 1000);
}

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(function() { el.classList.remove("show"); }, 3000);
}

async function doLogin() {
  const phone = document.getElementById("phone").value.trim();
  const code = document.getElementById("code").value.trim();
  log("doLogin: phone=" + phone + " code=" + code + " session=" + SESSION_ID);

  if (!/^1[3-9][0-9]{9}$/.test(phone)) {
    showError("请输入正确的手机号");
    return;
  }
  if (!code) {
    showError("请输入验证码");
    return;
  }

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "登录中...";

  try {
    const body = JSON.stringify({ phone: phone, code: code, session_id: SESSION_ID });
    log("POST /api/login body=" + body.substring(0, 80));
    const resp = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body
    });
    log("Response status: " + resp.status);
    const data = await resp.json();
    log("Response: " + JSON.stringify(data).substring(0, 100));

    if (data.success) {
      log("SUCCESS - token saved with session_id=" + SESSION_ID);
      document.getElementById("successOverlay").classList.add("show");
    } else {
      showError(data.error || "登录失败");
      btn.disabled = false;
      btn.textContent = "登 录";
    }
  } catch (e) {
    log("ERROR: " + e.message);
    showError("网络错误: " + e.message);
    btn.disabled = false;
    btn.textContent = "登 录";
  }
}
</script>

</body>
</html>
