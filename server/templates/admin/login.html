<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agix 管理后台</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
  }
  .container { width: 100%; max-width: 360px; padding: 0 20px; }
  h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; text-align: center; margin-bottom: 24px; }
  .form { background: #fff; border-radius: 8px; padding: 28px 24px; }
  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  .field input {
    width: 100%; height: 44px; border: 1px solid #ddd; border-radius: 6px;
    padding: 0 12px; font-size: 15px; outline: none; transition: border-color .2s;
  }
  .field input:focus { border-color: #4f46e5; }
  .btn-submit {
    width: 100%; height: 46px; background: #4f46e5; color: #fff; border: none;
    border-radius: 6px; font-size: 16px; font-weight: 500; cursor: pointer;
  }
  .btn-submit:disabled { background: #a5b4fc; cursor: not-allowed; }
  .error-msg { color: #e53e3e; font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>

<div class="container">
  <h1>Agix 管理后台</h1>
  <div class="form">
    <div class="field">
      <label>管理员密码</label>
      <input type="password" id="password" placeholder="请输入密码" autofocus>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="doLogin()">登 录</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<script>
document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doLogin();
});

async function doLogin() {
  const password = document.getElementById("password").value;
  const btn = document.getElementById("submitBtn");
  const err = document.getElementById("errorMsg");

  if (!password) { err.textContent = "请输入密码"; return; }

  btn.disabled = true;
  btn.textContent = "登录中...";
  err.textContent = "";

  try {
    const resp = await fetch("/admin/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password })
    });
    const data = await resp.json();
    if (data.success) {
      window.location.href = "/admin";
    } else {
      err.textContent = data.error || "登录失败";
      btn.disabled = false;
      btn.textContent = "登 录";
    }
  } catch (e) {
    err.textContent = "网络错误";
    btn.disabled = false;
    btn.textContent = "登 录";
  }
}
</script>

</body>
</html>
