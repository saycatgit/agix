<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agix 管理后台</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    font-size: 14px;
  }

  .header {
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header .brand { font-size: 16px; font-weight: 600; }
  .header .actions { display: flex; gap: 8px; align-items: center; }
  .header .actions a, .header .actions button {
    font-size: 13px; color: #888; text-decoration: none; border: none; background: none;
    padding: 4px 10px; border-radius: 4px; cursor: pointer;
  }
  .header .actions a:hover, .header .actions button:hover { background: #f0f0f0; color: #333; }

  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    padding: 20px 24px;
    max-width: 1100px;
  }
  .stat-card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    padding: 16px 18px;
  }
  .stat-card .value { font-size: 28px; font-weight: 600; line-height: 1.2; }
  .stat-card .label { font-size: 12px; color: #888; margin-top: 4px; }

  .main { padding: 0 24px 40px; max-width: 1100px; }

  .tabs {
    display: flex; gap: 0; margin-bottom: 14px;
    border-bottom: 2px solid #e5e5e5;
  }
  .tabs button {
    border: none; background: none; padding: 8px 18px; font-size: 13px;
    cursor: pointer; color: #888; border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }
  .tabs button.active { color: #4f46e5; border-bottom-color: #4f46e5; font-weight: 500; }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar input[type="text"] {
    height: 34px; border: 1px solid #ddd; border-radius: 4px;
    padding: 0 10px; font-size: 13px; outline: none; width: 200px;
  }
  .toolbar input[type="text"]:focus { border-color: #4f46e5; }
  .toolbar select {
    height: 34px; border: 1px solid #ddd; border-radius: 4px;
    padding: 0 8px; font-size: 13px; outline: none; background: #fff;
  }
  .toolbar select:focus { border-color: #4f46e5; }

  .table-wrap {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 12px; font-weight: 500;
    color: #888; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 10px 14px; border-bottom: 1px solid #e5e5e5;
    background: #fafafa;
  }
  td {
    padding: 10px 14px; border-bottom: 1px solid #f0f0f0;
    font-size: 13px; vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  td.token { font-family: monospace; font-size: 12px; word-break: break-all; max-width: 300px; }
  td.phone { white-space: nowrap; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 500;
  }
  .badge.active { background: #dcfce7; color: #166534; }
  .badge.expired { background: #f3f4f6; color: #9ca3af; }
  .badge.yes { background: #dcfce7; color: #166534; }
  .badge.no { background: #f3f4f6; color: #9ca3af; }

  .btn-revoke {
    height: 28px; padding: 0 10px; border: 1px solid #e53e3e; border-radius: 4px;
    background: #fff; color: #e53e3e; font-size: 12px; cursor: pointer;
  }
  .btn-revoke:hover { background: #fef2f2; }
  .btn-revoke:disabled { border-color: #ccc; color: #ccc; cursor: not-allowed; }

  .pagination {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; font-size: 13px;
  }
  .pagination .info { color: #888; }
  .pagination button {
    height: 30px; padding: 0 14px; border: 1px solid #ddd; border-radius: 4px;
    background: #fff; font-size: 13px; cursor: pointer;
  }
  .pagination button:hover:not(:disabled) { border-color: #4f46e5; color: #4f46e5; }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

  .section { margin-top: 32px; }
  .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .empty { text-align: center; padding: 40px 0; color: #999; font-size: 14px; }

  /* modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35);
    z-index: 100; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 8px; padding: 28px 24px;
    width: 100%; max-width: 380px;
  }
  .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .modal .field { margin-bottom: 16px; }
  .modal .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  .modal .field input {
    width: 100%; height: 40px; border: 1px solid #ddd; border-radius: 6px;
    padding: 0 12px; font-size: 14px; outline: none;
  }
  .modal .field input:focus { border-color: #4f46e5; }
  .modal .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .modal .btns button {
    height: 36px; padding: 0 16px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .btn-cancel { background: #fff; border: 1px solid #ddd; color: #555; }
  .btn-save { background: #4f46e5; border: none; color: #fff; }
  .btn-save:disabled { background: #a5b4fc; cursor: not-allowed; }
  .modal .modal-error { color: #e53e3e; font-size: 13px; margin-top: 8px; min-height: 18px; }

  .toast {
    position: fixed; top: 16px; right: 16px; z-index: 200;
    padding: 10px 18px; border-radius: 6px; font-size: 13px;
    color: #fff; opacity: 0; transition: opacity .3s;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: #16a34a; }
  .toast.error { background: #e53e3e; }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); padding: 14px 16px; }
    .main { padding: 0 16px 32px; }
    .header { padding: 0 16px; }
    td.token { max-width: 140px; }
  }
</style>
</head>
<body>

<div class="header">
  <span class="brand">Agix 管理后台</span>
  <div class="actions">
    <button onclick="openPwdModal()">修改密码</button>
    <a href="/admin/logout">退出</a>
  </div>
</div>

<div class="stats" id="statsRow"></div>

<div class="main">
  <div class="tabs">
    <button class="active" onclick="switchTab('tokens')">Token 管理</button>
    <button onclick="switchTab('users')">用户管理</button>
  </div>

  <div id="tabTokens">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="搜索手机号..." oninput="debounceSearch()">
      <select id="statusFilter" onchange="loadTokens()">
        <option value="all">全部</option>
        <option value="active">有效</option>
        <option value="expired">已过期</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Token</th>
            <th>手机号</th>
            <th>会话ID</th>
            <th>过期时间</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tokenBody"></tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div id="tabUsers" style="display:none">
    <div class="toolbar">
      <input type="text" id="userSearch" placeholder="搜索手机号..." oninput="debounceUserSearch()">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>手机号</th>
            <th>注册时间</th>
            <th>最近登录</th>
            <th>登录次数</th>
          </tr>
        </thead>
        <tbody id="userBody"></tbody>
      </table>
      <div class="pagination" id="userPagination"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">最近登录记录</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>手机号</th>
            <th>IP</th>
            <th>系统</th>
            <th>客户端</th>
            <th>登录时间</th>
          </tr>
        </thead>
        <tbody id="loginLogBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- password change modal -->
<div class="modal-overlay" id="pwdModal">
  <div class="modal">
    <h2>修改管理员密码</h2>
    <div class="field">
      <label>旧密码</label>
      <input type="password" id="oldPwd" placeholder="请输入旧密码" autocomplete="off">
    </div>
    <div class="field">
      <label>新密码</label>
      <input type="password" id="newPwd" placeholder="至少4位" autocomplete="off">
    </div>
    <div class="modal-error" id="modalError"></div>
    <div class="btns">
      <button class="btn-cancel" onclick="closePwdModal()">取消</button>
      <button class="btn-save" id="savePwdBtn" onclick="changePassword()">确认修改</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOAST_DURATION = 2500;
let currentPage = 1;
let userPage = 1;
let searchTimer = null;
let userSearchTimer = null;
let activeTab = 'tokens';

function debounceSearch() {
  if (searchTimer) clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentPage = 1; loadTokens(); }, 300);
}

function debounceUserSearch() {
  if (userSearchTimer) clearTimeout(userSearchTimer);
  userSearchTimer = setTimeout(() => { userPage = 1; loadUsers(); }, 300);
}

function showToast(msg, kind) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + kind + " show";
  setTimeout(() => { t.classList.remove("show"); }, TOAST_DURATION);
}

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate())
    + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tabs button').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'tokens') || (i === 1 && tab === 'users'));
  });
  document.getElementById('tabTokens').style.display = tab === 'tokens' ? '' : 'none';
  document.getElementById('tabUsers').style.display = tab === 'users' ? '' : 'none';
  if (tab === 'users') loadUsers();
}

// --- stats ---
async function loadStats() {
  try {
    const resp = await fetch("/admin/api/stats");
    const data = await resp.json();
    const container = document.getElementById("statsRow");
    container.innerHTML = [
      { v: data.total_tokens, l: "Token 总数" },
      { v: data.active_tokens, l: "有效 Token" },
      { v: data.expired_tokens, l: "已过期" },
      { v: data.total_users, l: "注册用户" },
      { v: data.distinct_phones, l: "活跃手机号" },
    ].map(c =>
      '<div class="stat-card"><div class="value">' + c.v + '</div><div class="label">' + c.l + '</div></div>'
    ).join("");

    const logBody = document.getElementById("loginLogBody");
    if (data.recent_logins.length === 0) {
      logBody.innerHTML = '<tr><td colspan="5" class="empty">暂无记录</td></tr>';
    } else {
      logBody.innerHTML = data.recent_logins.map(r =>
        '<tr><td class="phone">' + r.phone + '</td><td>' + (r.ip || "-") + '</td><td>' + (r.system || "-") + '</td><td>' + (r.client_system || "-") + '</td><td>' + fmtTime(r.created_at) + '</td></tr>'
      ).join("");
    }
  } catch (e) {
    console.error("loadStats error", e);
  }
}

// --- tokens ---
async function loadTokens() {
  const search = document.getElementById("searchInput").value.trim();
  const status = document.getElementById("statusFilter").value;
  const params = new URLSearchParams({ page: currentPage, search, status });

  try {
    const resp = await fetch("/admin/api/tokens?" + params.toString());
    const data = await resp.json();
    const body = document.getElementById("tokenBody");
    if (data.tokens.length === 0) {
      body.innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
    } else {
      body.innerHTML = data.tokens.map(r =>
        '<tr>' +
          '<td class="token">' + r.token + '</td>' +
          '<td class="phone">' + r.phone + '</td>' +
          '<td style="font-size:11px;color:#888;">' + (r.session_id ? r.session_id.substring(0, 12) + "..." : "-") + '</td>' +
          '<td>' + fmtTime(r.expires_at) + '</td>' +
          '<td><span class="badge ' + (r.active ? "active" : "expired") + '">' + (r.active ? "有效" : "过期") + '</span></td>' +
          '<td>' + (r.active
            ? '<button class="btn-revoke" onclick="revokeToken(\'' + r.token + '\', this)">撤销</button>'
            : '<span class="badge no">-</span>') + '</td>' +
        '</tr>'
      ).join("");
    }

    const totalPages = Math.ceil(data.total / data.per_page) || 1;
    document.getElementById("pagination").innerHTML =
      '<span class="info">第 ' + data.page + ' / ' + totalPages + ' 页，共 ' + data.total + ' 条</span>' +
      '<span>' +
        '<button ' + (data.page <= 1 ? "disabled" : 'onclick="goPage(' + (data.page-1) + ')"') + '>上一页</button> ' +
        '<button ' + (data.page >= totalPages ? "disabled" : 'onclick="goPage(' + (data.page+1) + ')"') + '>下一页</button>' +
      '</span>';
  } catch (e) {
    console.error("loadTokens error", e);
  }
}

function goPage(n) { currentPage = n; loadTokens(); }

async function revokeToken(token, btn) {
  if (!confirm("确认撤销此 Token？该用户将需要重新登录。")) return;
  btn.disabled = true;
  try {
    const resp = await fetch("/admin/api/tokens/revoke", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token })
    });
    const data = await resp.json();
    if (data.success) {
      showToast("Token 已撤销", "success");
      loadTokens();
      loadStats();
    } else {
      showToast(data.error || "操作失败", "error");
      btn.disabled = false;
    }
  } catch (e) {
    showToast("网络错误", "error");
    btn.disabled = false;
  }
}

// --- users list ---
async function loadUsers() {
  const search = document.getElementById("userSearch").value.trim();
  const params = new URLSearchParams({ page: userPage, search });

  try {
    const resp = await fetch("/admin/api/users?" + params.toString());
    const data = await resp.json();
    const body = document.getElementById("userBody");
    if (data.users.length === 0) {
      body.innerHTML = '<tr><td colspan="4" class="empty">暂无数据</td></tr>';
    } else {
      body.innerHTML = data.users.map(r =>
        '<tr>' +
          '<td class="phone">' + r.phone + '</td>' +
          '<td>' + fmtTime(r.created_at) + '</td>' +
          '<td>' + (r.last_login_at ? fmtTime(r.last_login_at) : '-') + '</td>' +
          '<td>' + r.login_count + '</td>' +
        '</tr>'
      ).join("");
    }

    const totalPages = Math.ceil(data.total / data.per_page) || 1;
    document.getElementById("userPagination").innerHTML =
      '<span class="info">第 ' + data.page + ' / ' + totalPages + ' 页，共 ' + data.total + ' 条</span>' +
      '<span>' +
        '<button ' + (data.page <= 1 ? "disabled" : 'onclick="goUserPage(' + (data.page-1) + ')"') + '>上一页</button> ' +
        '<button ' + (data.page >= totalPages ? "disabled" : 'onclick="goUserPage(' + (data.page+1) + ')"') + '>下一页</button>' +
      '</span>';
  } catch (e) {
    console.error("loadUsers error", e);
  }
}

function goUserPage(n) { userPage = n; loadUsers(); }

// --- password change ---
function openPwdModal() {
  document.getElementById("pwdModal").classList.add("show");
  document.getElementById("oldPwd").value = '';
  document.getElementById("newPwd").value = '';
  document.getElementById("modalError").textContent = '';
}

function closePwdModal() {
  document.getElementById("pwdModal").classList.remove("show");
}

async function changePassword() {
  const oldPwd = document.getElementById("oldPwd").value;
  const newPwd = document.getElementById("newPwd").value;
  const errEl = document.getElementById("modalError");
  const btn = document.getElementById("savePwdBtn");

  if (!oldPwd || !newPwd) { errEl.textContent = "请填写旧密码和新密码"; return; }
  if (newPwd.length < 4) { errEl.textContent = "新密码至少4位"; return; }

  btn.disabled = true;
  errEl.textContent = '';

  try {
    const resp = await fetch("/admin/api/change_password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
    });
    const data = await resp.json();
    if (data.success) {
      showToast("密码修改成功", "success");
      closePwdModal();
    } else {
      errEl.textContent = data.error || "修改失败";
      btn.disabled = false;
    }
  } catch (e) {
    errEl.textContent = "网络错误";
    btn.disabled = false;
  }
}

// init
loadStats();
loadTokens();
</script>

</body>
</html>
